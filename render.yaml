services:
  - type: web
    name: medguard-ai
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: MEDGUARD_DATABASE_URL
        fromDatabase:
          name: medguard-db
          property: connectionString
      - key: MEDGUARD_ADMIN_KEY
        generateValue: true

databases:
  - name: medguard-db
    plan: free
    databaseName: medguard
    user: medguard
    region: singapore
